name: Android enhetsrunde

# Kjører den MASKINELLE delen av den fysiske Android-runden for varslene
# (tests/android-device.js) på en ekte Android-emulator — alarmkøen, en
# appomstart, en drept prosess, en telefonrestart, et levert varsel og trykket
# på det. Det er den samme fila eieren kjører mot sin egen telefon; forskjellen
# er bare hvilken enhet som svarer, og at emulatoren ikke er innlogget (den
# kjører derfor RIGG-modus, se fila).
#
# Kjeden er den vanlige, pluss en emulator:
#
#   node build.js → dist/ → cap sync android → gradlew assembleDebug
#                 → adb install → node tests/android-device.js
#
# Uten dette steget er harnesset bare en fil. MED det er alt i den fysiske
# runden som ikke krever et øye, maskinelt bevist på hver PR som rører
# Android-siden (docs/mobilapp-plan.md, «Det runden MÅLER»).
#
# Trigger: manuelt, og på de pull requestene som kan gjøre runden ugyldig.
# Vanlige Huskis-PR-er skal ikke betale for en emulator.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'build.js'
      # app.js ER produksjonskoden runden prøver: varseladapteren og
      # `window.__huskis.androidChannel` bor der. Uten denne linjen kunne en
      # endring i adapteren brekke de native varslene uten at enhetsrunden kjørte
      # en eneste gang — og det er nøyaktig det hullet workflowen finnes for å
      # lukke. Prisen er en emulatorrunde på de fleste Huskis-PR-er, og den er
      # valgt med vilje: et varsel som ikke kommer fram er dyrere.
      - 'app.js'
      - 'tests/android-device.js'
      - 'tests/android-alarm-queue.test.js'
      - '.github/workflows/android-device.yml'

concurrency:
  group: android-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enhet:
    name: Varslene på en emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer npm-avhengighetene reproduserbart
        run: npm ci

      - name: Bygg webappen
        run: node build.js

      - name: Kopier dist/ inn i Android-prosjektet
        run: npx cap sync android

      # Emulatoren trenger maskinvarevirtualisering for å være raskere enn
      # ubrukelig. Runneren HAR /dev/kvm, men bare for gruppen `kvm` —
      # regelen under gir den til alle, som er den vanlige oppskriften.
      - name: Slå på KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Plattformen leses fra android/variables.gradle, som i debug-APK-jobben,
      # så SDK-en og prosjektet ikke kan komme i utakt. SYSTEMBILDET er et annet
      # valg: det finnes ikke alltid for det ferskeste nivået, så kandidatene
      # prøves ovenfra og ned og den første som installeres vinner.
      - name: Installer SDK, emulator og systembilde
        run: |
          set -euo pipefail
          sdk="$(grep -oE 'compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+' android/variables.gradle | grep -oE '[0-9]+')"
          echo "compileSdkVersion=$sdk"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` dør av SIGPIPE i det sdkmanager slutter å lese, og med
          # pipefail ville den døden blitt lest som en feilet godkjenning.
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" "platforms;android-$sdk" platform-tools emulator
          img=""
          for n in "$sdk" 35 34; do
            kandidat="system-images;android-$n;google_apis;x86_64"
            if "$sdkmanager" "$kandidat"; then img="$kandidat"; break; fi
          done
          if [ -z "$img" ]; then echo "Fant ingen systembilde å kjøre på" >&2; exit 1; fi
          echo "EMU_IMAGE=$img" >> "$GITHUB_ENV"
          echo "Systembilde: $img"

      # Emulatoren er et QEMU-bygg som lenker mot en håndfull systembiblioteker
      # runneren ikke nødvendigvis har. Mangler ett av dem, DØR prosessen med én
      # gang — og utenfra ser det ut som en enhet som aldri registrerer seg hos
      # adb. Installasjonen er derfor defensiv: er pakkene der alt, koster den
      # ingenting, og den får ikke felle jobben (da svarer emulatorloggen i stedet
      # for at apt gjør det). Begge kallene har tak — et `apt-get update` som
      # henger mot et tregt speil har felt denne CI-en før.
      - name: Systembibliotekene emulatoren lenker mot
        run: |
          set -uo pipefail
          sudo timeout 180 apt-get update -qq || echo "apt-get update feilet — prøver install likevel"
          sudo timeout 300 apt-get install -y --no-install-recommends \
            libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 \
            libgl1 libglx0 libx11-xcb1 libxdamage1 libxrandr2 libdbus-1-3 \
            || echo "apt-get install feilet — emulatorloggen sier om noe faktisk mangler"
          exit 0

      # `adb` ligger IKKE på PATH på runneren, og harnesset kaller den direkte.
      # Uten dette steget feiler runden med «adb: command not found» — og
      # loggsamlingen etterpå gjør det samme, så man ser ikke hvorfor.
      - name: Legg Android-verktøyene på PATH
        run: |
          set -euo pipefail
          for d in platform-tools emulator cmdline-tools/latest/bin; do
            echo "$ANDROID_HOME/$d" >> "$GITHUB_PATH"
          done
          # … OG avtal HVOR AVD-en skal bo. De to verktøyene er ikke enige av seg
          # selv: `avdmanager` skriver til $ANDROID_USER_HOME/avd (på runneren
          # ~/.config/.android/avd), mens `emulator` 37.x bare leter i
          # $ANDROID_AVD_HOME, $ANDROID_SDK_HOME/avd og $HOME/.android/avd. Uten
          # denne linjen lager avdmanager en AVD emulatoren aldri finner — og
          # feilen ser ut som en emulator som ikke vil starte.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android/avd"

      - name: Lag og start emulatoren
        run: |
          set -euo pipefail
          adb --version
          # ER akselerasjonen brukbar? Dette svarer på det FØR vi venter tolv
          # minutter på en oppstart som krabber i programvare — som er nøyaktig
          # slik en emulator uten KVM ser ut: ingen feil, bare en enhet som aldri
          # blir ferdig å boote. `-accel-check` avslutter med feil hvis den ikke
          # kan brukes, og da skal jobben si det med én gang.
          emulator -accel-check
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n huskis -k "$EMU_IMAGE" --force
          avdmanager list avd
          # SPØR EMULATOREN SELV om den ser AVD-en. Det er den ene sjekken som
          # betyr noe: `avdmanager` kan ha skrevet den et sted emulatoren ikke
          # leter, og da svarer den «Unknown AVD name» etter at vi har ventet fem
          # minutter på en enhet som aldri kommer.
          if ! emulator -list-avds | grep -qx huskis; then
            echo "Emulatoren ser ingen AVD som heter «huskis»" >&2
            echo "-- emulator -list-avds --" >&2; emulator -list-avds >&2 || true
            echo "-- $ANDROID_AVD_HOME --" >&2; ls -la "$ANDROID_AVD_HOME" >&2 || true
            exit 1
          fi
          # RAM og kjerner eksplisitt: en AVD laget uten en enhetsprofil får
          # standardverdier som er for små for et moderne Android, og da bruker
          # oppstarten evigheter (eller kommer aldri).
          nohup emulator -avd huskis \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save \
            -memory 4096 -cores 2 -accel on \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            > emulator.log 2>&1 &
          # Hva emulatoren SELV sa de første sekundene, uansett utfall. En
          # emulator som mangler et systembibliotek dør med én gang, og da står
          # grunnen her — i stedet for at jobben ser ut som en treg oppstart i fem
          # minutter.
          sleep 20
          echo "== emulator.log (første 20 s) =="
          tail -40 emulator.log || true
          echo "== emulatorprosessen =="
          pgrep -af qemu-system || echo "(ingen qemu-prosess — emulatoren døde)"
          # BEGGE ventingene har tak, og det er ikke pynt: `adb wait-for-device`
          # venter i all evighet, så en emulator som krasjer under oppstart ville
          # holdt jobben til dens egen 75-minutters grense — og da hadde vi brukt
          # en time på ingenting. Loggen skrives ut her OG lastes opp som artifact,
          # så grunnen er lesbar uten å laste ned noe.
          if ! timeout 300 adb wait-for-device; then
            echo "Emulatoren registrerte seg ikke hos adb innen 300 s" >&2
            tail -100 emulator.log >&2 || true
            exit 1
          fi
          # `sys.boot_completed` er det ene signalet som betyr at systemet er
          # oppe. Uten ventingen installerer vi mot en halvbooted enhet.
          if ! timeout 600 bash -c \
            'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'; then
            echo "Emulatoren fullførte ikke oppstart innen 600 s" >&2
            tail -100 emulator.log >&2 || true
            exit 1
          fi
          adb shell input keyevent 82      # lås opp (ingen PIN på en ny AVD)
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk

      - name: Bygg debug-APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Selve runden. `--install` tar APK-en inn, og harnesset gjør resten —
      # inkludert en EKTE omstart av emulatoren (punkt G), som er grunnen til at
      # jobben har romslig tid.
      - name: Kjør varselrunden på enheten
        run: node tests/android-device.js --install android/app/build/outputs/apk/debug/app-debug.apk

      # Når runden feiler er loggene hele forklaringen: hva emulatoren gjorde,
      # og hva appen sa over broen.
      # Hvert adb-kall har tak: uten en enhet kan de henge, og da hadde
      # loggsamlingen blitt den nye grunnen jobben sto fast.
      - name: Samle logger
        if: always()
        run: |
          mkdir -p device-logs
          cp emulator.log device-logs/ || true
          timeout 60 adb logcat -d > device-logs/logcat.txt || true
          timeout 60 adb shell dumpsys alarm > device-logs/dumpsys-alarm.txt || true
          timeout 60 adb shell dumpsys notification --noredact > device-logs/dumpsys-notification.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huskis-device-logs
          path: device-logs
          if-no-files-found: warn
